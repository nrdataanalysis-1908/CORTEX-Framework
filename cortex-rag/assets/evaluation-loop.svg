<text x="48" y="48" fill="#55D9FF" font-family="Arial" font-size="12" letter-spacing="2">NR TECH RESEARCH LABORATORY / EVALUATION NOTE 01</text><text x="48" y="91" fill="#F1F7FC" font-family="Arial" font-size="29" font-weight="700">Retrieval evaluation protocol</text><text x="48" y="119" fill="#91A9BE" font-family="Arial" font-size="14">Gold evidence set · Top-K retrieval · reproducible report · error inspection</text>
<g font-family="Arial">
