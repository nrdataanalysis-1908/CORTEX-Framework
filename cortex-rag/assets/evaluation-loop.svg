<g transform="translate(636 164)"><rect width="242" height="142" rx="7" fill="#0B2639" stroke="#1F9BC0"/><text x="18" y="30" fill="#4DD5FF" font-size="11">03 / MEASUREMENT</text><text x="18" y="72" fill="#F0F6FA" font-size="25" font-weight="700">Hit Rate@K</text><text x="18" y="105" fill="#91A9BE" font-size="13">Gold evidence found in top-K</text><text x="18" y="126" fill="#6888A2" font-size="11">Hits / total questions</text></g>
