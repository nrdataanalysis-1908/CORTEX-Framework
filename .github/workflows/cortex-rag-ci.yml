name: CORTEX RAG CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "cortex-rag/**"
      - ".github/workflows/cortex-rag-ci.yml"
  push:
    branches:
      - main
    paths:
      - "cortex-rag/**"
      - ".github/workflows/cortex-rag-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cortex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: cortex-rag
    env:
      PYTHONPATH: ${{ github.workspace }}/cortex-rag
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cortex
      OPENAI_API_KEY: sk-test-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-rag/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q

  windows-pdf-isolation:
    name: Windows PDF worker isolation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cortex-rag
    env:
      PYTHONPATH: ${{ github.workspace }}/cortex-rag
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cortex
      OPENAI_API_KEY: sk-test-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-rag/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test Windows Job Object isolation
        run: python -m pytest tests/test_pdf_isolation.py -q

  container-image:
    name: Hardened Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-rag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare CI environment file
        env:
          POSTGRES_PASSWORD: ci_url_safe_password_123456789
          OPENAI_API_KEY: sk-test-placeholder
          API_ACCESS_TOKEN: ci_test_token_with_more_than_32_characters
        run: |
          printf 'POSTGRES_PASSWORD=%s\\nOPENAI_API_KEY=%s\\nAPI_ACCESS_TOKEN=%s\\nDATABASE_URL=postgresql://postgres:postgres@localhost:5432/cortex\\n' "$POSTGRES_PASSWORD" "$OPENAI_API_KEY" "$API_ACCESS_TOKEN" > .env
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci_url_safe_password_123456789
          OPENAI_API_KEY: sk-test-placeholder
          API_ACCESS_TOKEN: ci_test_token_with_more_than_32_characters
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag cortex-rag:ci .
      - name: Verify non-root image user
        shell: bash
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' cortex-rag:ci)"
          test "$image_user" = "cortex:cortex"
