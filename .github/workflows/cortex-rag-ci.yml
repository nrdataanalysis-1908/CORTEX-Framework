name: CORTEX RAG CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "cortex-rag/**"
      - ".github/workflows/cortex-rag-ci.yml"
  push:
    branches:
      - main
    paths:
      - "cortex-rag/**"
      - ".github/workflows/cortex-rag-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cortex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: cortex-rag
    env:
      PYTHONPATH: ${{ github.workspace }}/cortex-rag
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cortex
      OPENAI_API_KEY: sk-test-placeholder
      CORTEX_API_KEY: ci-test-api-key-with-at-least-32-chars
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-rag/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
